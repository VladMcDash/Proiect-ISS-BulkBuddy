# ========================================================
# BulkBuddy — Application Configuration (Development)
# ========================================================

spring.application.name=BulkBuddy

# ---- Server ----
server.port=8080

# ---- H2 In-Memory Database ----
spring.datasource.url=jdbc:h2:mem:bulkbuddydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ---- JPA / Hibernate ----
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---- H2 Console (dev only) ----
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---- Jackson ----
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# ---- JWT ----
app.jwt.secret=BulkBuddySecretKeyForJWT2024MustBeAtLeast256BitsLongForHS256Algorithm!!
app.jwt.expiration-ms=86400000
